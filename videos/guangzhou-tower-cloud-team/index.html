    <script src="vendor/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      @font-face {
        font-family: "PixelChinese";
        src: local("PingFang SC");
        font-style: normal;
        font-weight: 400 900;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e9f5f5;
      }
      body {
        font-family: "PixelChinese", sans-serif;
      }
      #main {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e9f5f5;
      }
      .scene-slot {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .caption {
        position: absolute;
        left: 170px;
        bottom: 58px;
        width: 1420px;
        min-height: 96px;
        z-index: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 46px;
        color: #17324d;
        background: #e9f5f5;
        border: 5px solid #17324d;
        box-shadow: 10px 10px 0 #0b2435;
      }
      .caption-dialogue, .caption-thought {
        left: auto;
        right: 150px;
        bottom: 72px;
        width: auto;
        max-width: 1180px;
        min-width: 620px;
        border-radius: 0;
        background: #17324d;
        color: #e9f5f5;
        transform: rotate(-0.4deg);
      }
      .caption-dialogue::after {
        content: "";
        position: absolute;
        right: 110px;
        bottom: -38px;
        width: 0;
        height: 0;
        border: 20px solid transparent;
        border-top-color: #17324d;
        border-left-width: 42px;
      }
      .caption-thought {
        border: 6px dashed #f7b32b;
      }
      .caption-narration {
        left: 150px;
        bottom: 54px;
        width: 1280px;
        border-left: 18px solid #e34a3a;
      }
      .caption p {
        margin: 0;
        max-width: 1460px;
        font-size: 42px;
        line-height: 1.35;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0;
      }
      .caption span {
        flex: 0 0 auto;
        margin-right: 22px;
        padding: 8px 14px;
        font-size: 26px;
        font-weight: 900;
        color: #e9f5f5;
        background: #e34a3a;
      }
      .transition {
        position: absolute;
        inset: 0;
        z-index: 800;
        overflow: hidden;
      }
      .transition-fx {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        background: #e34a3a;
      }
      .transition span {
        position: absolute;
        display: block;
        background: #f7b32b;
      }
      .transition-whip-pan span {
        top: 0;
        width: 34%;
        height: 100%;
      }
      .transition-whip-pan span:nth-child(1) { left: 0; background: #e34a3a; }
      .transition-whip-pan span:nth-child(2) { left: 33%; background: #17324d; }
      .transition-whip-pan span:nth-child(3) { left: 66%; background: #f7b32b; }
      .transition-horizontal-blinds { background: transparent; }
      .transition-horizontal-blinds span { left: 0; width: 100%; height: 92px; }
      .transition-chromatic-split { background: #e34a3a; mix-blend-mode: screen; }
      .transition-chromatic-split span { inset: 0; width: 100%; height: 100%; }
      .transition-chromatic-split span:nth-child(1) { left: -24px; background: #ff334f; }
      .transition-chromatic-split span:nth-child(2) { left: 24px; background: #22d9ff; }
      .transition-chromatic-split span:nth-child(3) { background: #17324d; opacity: .42; }
      .transition-grid-dissolve { background: transparent; }
      .transition-grid-dissolve span { width: 242px; height: 218px; }
      .transition-blur-through, .transition-light-leak {
        background: #f7b32b;
        box-shadow: inset 0 0 180px #17324d;
      }
      .transition-blur-through span, .transition-light-leak span {
        width: 42%;
        height: 100%;
        top: 0;
        opacity: .36;
      }
      .transition-blur-through span:nth-child(2), .transition-light-leak span:nth-child(2) { left: 30%; }
      .transition-blur-through span:nth-child(3), .transition-light-leak span:nth-child(3) { right: 0; }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#transition-1-whip-pan-fx", {opacity:0,x:-1920}, {opacity:1,x:0,duration:0.45,ease:"power4.in"}, 12.05);
        tl.to("#transition-1-whip-pan-fx", {opacity:0,x:1920,duration:0.45,ease:"power4.out"}, 12.5);
        tl.set("#transition-1-whip-pan-fx", {opacity:0}, 12.95);

        tl.to("#transition-2-horizontal-blinds-fx", {opacity:0,scale:1.08,duration:0.45,ease:"sine.out"}, 26);
        tl.set("#transition-2-horizontal-blinds-fx", {opacity:0}, 26.45);
