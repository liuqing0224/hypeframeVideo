    <style>
      * { box-sizing: border-box; }
      @font-face {
        font-family: "PixelChinese";

        overflow: hidden;
        background: #071b2e;
      }
      .scene-slot {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .caption {
        position: absolute;
        left: 170px;
        bottom: 58px;
        width: 1420px;
        min-height: 96px;
        z-index: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 46px;
        color: #f5f7ff;
        background: #071b2e;
        border: 5px solid #f5f7ff;
        box-shadow: 10px 10px 0 #020b16;
      }
      .caption-dialogue, .caption-thought {
        left: auto;
        right: 150px;
        bottom: 72px;
        width: auto;
        max-width: 1180px;
        min-width: 620px;
        border-radius: 0;
        background: #f5f7ff;
        color: #071b2e;
        transform: rotate(-0.4deg);
      }
      .caption-dialogue::after {
        content: "";
        position: absolute;
        right: 110px;
        bottom: -38px;
        width: 0;
        height: 0;
        border: 20px solid transparent;
        border-top-color: #f5f7ff;
        border-left-width: 42px;
      }
      .caption-thought {
        border: 6px dashed #ffc857;
      }
      .caption-narration {
        left: 150px;
        bottom: 54px;
        width: 1280px;
        border-left: 18px solid #28d7d0;
      }
      .caption p {
        margin: 0;
        max-width: 1460px;
        font-size: 42px;
        line-height: 1.35;
        font-weight: 700;
        text-align: center;
        letter-spacing: 0;
      }
      .caption span {
        flex: 0 0 auto;
        margin-right: 22px;
        padding: 8px 14px;
        font-size: 26px;
        font-weight: 900;
        color: #071b2e;
        background: #28d7d0;
      }
      .transition {
        position: absolute;
        inset: 0;
        z-index: 800;
        overflow: hidden;
      }
      .transition-fx {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
        background: #28d7d0;
      }
      .transition span {
        position: absolute;
        display: block;
        background: #ffc857;
      }
      .transition-whip-pan span {
        top: 0;
        width: 34%;
        height: 100%;
      }
      .transition-whip-pan span:nth-child(1) { left: 0; background: #28d7d0; }
      .transition-whip-pan span:nth-child(2) { left: 33%; background: #f5f7ff; }
      .transition-whip-pan span:nth-child(3) { left: 66%; background: #ffc857; }
      .transition-horizontal-blinds { background: transparent; }
      .transition-horizontal-blinds span { left: 0; width: 100%; height: 92px; }
      .transition-chromatic-split { background: #28d7d0; mix-blend-mode: screen; }
      .transition-chromatic-split span { inset: 0; width: 100%; height: 100%; }
      .transition-chromatic-split span:nth-child(1) { left: -24px; background: #ff334f; }
      .transition-chromatic-split span:nth-child(2) { left: 24px; background: #22d9ff; }
      .transition-chromatic-split span:nth-child(3) { background: #f5f7ff; opacity: .42; }
      .transition-grid-dissolve { background: transparent; }
      .transition-grid-dissolve span { width: 242px; height: 218px; }
      .transition-blur-through, .transition-light-leak {
        background: #ffc857;
        box-shadow: inset 0 0 180px #f5f7ff;
      }
      .transition-blur-through span, .transition-light-leak span {
        width: 42%;
        height: 100%;
        top: 0;
        opacity: .36;
      }
      .transition-blur-through span:nth-child(2), .transition-light-leak span:nth-child(2) { left: 30%; }
      .transition-blur-through span:nth-child(3), .transition-light-leak span:nth-child(3) { right: 0; }
    </style>
